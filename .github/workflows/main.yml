name: Update FPL data

on:
  schedule:
    - cron: "0 */3 * * *"   # co 3 godziny
  workflow_dispatch: {}      # ręczne odpalenie z zakładki Actions
  push:
    branches: [ main ]
    paths: [ "config.json", "fetch_data.py" ]

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Fetch FPL data
        run: python fetch_data.py
      - name: Commit data.json
        run: |
          git config user.name  "fpl-copilot-bot"
          git config user.email "actions@github.com"
          git add data.json
          if git diff --staged --quiet; then
            echo "Bez zmian w data.json."
          else
            git commit -m "chore: refresh data.json ($(date -u +%Y-%m-%dT%H:%MZ))"
            git push
          fi
