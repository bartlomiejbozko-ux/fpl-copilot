<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>FPL Copilot</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#37003C">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="FPL Copilot">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800;900&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root{
    --purple:#37003C; --purple2:#5a0a52;
    --green:#00FF87; --green-ink:#00a65a; --cyan:#04F5FF; --pink:#E90052; --amber:#c98a00;
    --bg:#e9e7ee; --card:#ffffff; --ink:#2b0730; --muted:#7a6b80;
    --line:rgba(55,0,60,.12); --line-strong:rgba(55,0,60,.22);
    --f1:#00e07a; --f2:#7ef2b0; --f3:#e3e1e7; --f4:#ff4d6d; --f5:#8b1034;
    --pitch1:#12833f; --pitch2:#0f7538;
  }
  *{box-sizing:border-box} html,body{margin:0}
  body{background:var(--bg);color:var(--ink);font-family:'Archivo',system-ui,sans-serif;
    -webkit-font-smoothing:antialiased;min-height:100vh;padding:0 14px 60px;
    padding-top:env(safe-area-inset-top)}
  .wrap{max-width:1000px;margin:0 auto}

  /* header — fioletowy pasek + gradientowy akcent FPL */
  .top{display:flex;align-items:center;gap:12px;flex-wrap:wrap;background:var(--purple);
    color:#fff;margin:0 -14px 0;padding:16px 18px 14px;position:relative}
  .top::after{content:"";position:absolute;left:0;right:0;bottom:0;height:4px;
    background:linear-gradient(90deg,var(--cyan),var(--green) 45%,var(--pink))}
  .mark{display:flex;align-items:baseline;gap:9px}
  .mark b{font-weight:900;font-size:19px;letter-spacing:-.02em;color:#fff}
  .mark span{color:var(--green);font-weight:900}
  .tagline{color:rgba(255,255,255,.72);font:400 12px/1.3 'Space Mono',monospace}
  .fresh{margin-left:auto;font:400 10px/1.3 'Space Mono',monospace;color:rgba(255,255,255,.6);text-align:right}

  .tabs{display:flex;gap:8px;margin:16px 0;flex-wrap:wrap}
  .tabs button{cursor:pointer;background:var(--card);border:1px solid var(--line);border-radius:999px;
    padding:9px 18px;color:var(--purple);font:800 13px/1 'Archivo';transition:all .15s}
  .tabs button:hover{border-color:var(--line-strong)}
  .tabs button.on{background:var(--purple);border-color:var(--purple);color:#fff}
  .tabs button:focus-visible{outline:2px solid var(--pink);outline-offset:2px}

  .hero{background:linear-gradient(120deg,var(--purple),var(--purple2));border-radius:16px;
    padding:18px 20px;display:flex;gap:18px;flex-wrap:wrap;align-items:center;margin-bottom:14px;color:#fff}
  .hero .tot{flex:1;min-width:180px}
  .hero .lab{font:700 10px/1 'Space Mono',monospace;letter-spacing:.16em;color:rgba(255,255,255,.7);text-transform:uppercase}
  .hero .big{font-weight:900;font-size:clamp(38px,10vw,60px);line-height:.9;letter-spacing:-.04em;color:var(--green)}
  .hero .sub{font:400 12px/1.4 'Space Mono',monospace;color:rgba(255,255,255,.75);margin-top:6px}
  .hero .stats{display:flex;gap:18px;flex-wrap:wrap}
  .stat .k{font:700 9px/1 'Space Mono',monospace;letter-spacing:.1em;color:rgba(255,255,255,.6);text-transform:uppercase}
  .stat .v{font-weight:900;font-size:22px;letter-spacing:-.02em;margin-top:5px;color:#fff}

  .h{display:flex;align-items:baseline;gap:10px;margin:20px 2px 12px}
  .h .no{font:700 11px/1 'Space Mono',monospace;color:var(--green-ink);letter-spacing:.1em}
  .h .t{font-weight:800;font-size:15px;color:var(--purple)}
  .h .d{color:var(--muted);font:400 11px/1.3 'Space Mono',monospace;margin-left:auto}

  /* boisko */
  .pitch{background:repeating-linear-gradient(0deg,var(--pitch1) 0 46px,var(--pitch2) 46px 92px);
    border-radius:16px;padding:16px 8px;position:relative;overflow:hidden}
  .pitch::before{content:"";position:absolute;inset:14px;border:2px solid rgba(255,255,255,.22);border-radius:8px;pointer-events:none}
  .rowline{display:flex;justify-content:center;gap:6px;position:relative;z-index:1;margin:5px 0;flex-wrap:wrap}
  .p{width:104px;cursor:pointer;background:#fff;border:1px solid rgba(0,0,0,.08);
    border-radius:12px;padding:8px 7px;display:flex;flex-direction:column;align-items:center;gap:4px;
    transition:transform .15s,box-shadow .15s;position:relative;box-shadow:0 2px 6px rgba(0,0,0,.18)}
  .p:hover{transform:translateY(-2px);box-shadow:0 4px 12px rgba(0,0,0,.28)}
  .p.sel{outline:2px solid var(--green-ink);outline-offset:0}
  .p:focus-visible{outline:2px solid var(--pink);outline-offset:2px}
  .p .line{display:flex;align-items:center;gap:5px;max-width:100%;width:100%;justify-content:center}
  .p .dot{width:8px;height:8px;border-radius:50%;flex:none}
  .dot.a{background:var(--green-ink)} .dot.d{background:var(--amber)} .dot.i{background:var(--pink)}
  .p .nm{font-weight:800;font-size:13px;line-height:1.1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--purple)}
  .p .fx{font:700 10px/1 'Space Mono',monospace;color:var(--muted);background:rgba(55,0,60,.07);
    padding:3px 7px;border-radius:6px;white-space:nowrap}
  .p .pts{font-weight:900;font-size:20px;line-height:1;letter-spacing:-.02em;color:var(--green-ink)}
  .p .badge{position:absolute;top:-7px;right:-7px;width:20px;height:20px;border-radius:50%;font:900 11px/20px 'Archivo';color:var(--purple);box-shadow:0 1px 4px rgba(0,0,0,.35)}
  .badge.c{background:var(--green)} .badge.v{background:var(--cyan)}
  .bench-strip{display:flex;gap:6px;justify-content:center;flex-wrap:wrap;margin-top:12px;padding-top:12px;border-top:1px dashed rgba(255,255,255,.35)}

  /* detal */
  .detail{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px 17px;margin-top:14px;box-shadow:0 2px 10px rgba(55,0,60,.06)}
  .dhead{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:14px}
  .dhead h2{margin:0;font-size:24px;font-weight:900;letter-spacing:-.02em;color:var(--purple)}
  .dhead .tag{font:700 10px/1 'Space Mono',monospace;padding:5px 8px;border-radius:7px;text-transform:uppercase}
  .tag.a{color:var(--green-ink);background:rgba(0,166,90,.12)}
  .tag.d{color:var(--amber);background:rgba(201,138,0,.14)}
  .tag.i{color:var(--pink);background:rgba(233,0,82,.12)}
  .dhead .dproj{margin-left:auto;text-align:right}
  .dproj .l{font:700 9px/1 'Space Mono',monospace;letter-spacing:.14em;color:var(--muted);text-transform:uppercase}
  .dproj .n{font-weight:900;font-size:30px;letter-spacing:-.03em;color:var(--green-ink)}
  .dgrid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
  .chain .cr{display:flex;align-items:center;gap:10px;padding:6px 0;border-bottom:1px solid var(--line)}
  .chain .cr:last-child{border:0}
  .chain .cl{font:400 12px/1.3 'Space Mono',monospace;color:var(--muted);flex:1}
  .chain .cd{font-weight:900;font-size:15px;font-family:'Space Mono',monospace;color:var(--purple)}
  .chain .run{font:400 10px/1 'Space Mono',monospace;color:var(--muted);width:60px;text-align:right}
  .meta .row{display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid var(--line)}
  .meta .row:last-child{border:0}
  .meta .k{font:400 12px/1.3 'Space Mono',monospace;color:var(--muted)}
  .meta .v{font:700 13px/1 'Space Mono',monospace;color:var(--ink)}
  .newsline{font:400 12px/1.5 'Archivo';margin:12px 0 0;padding-top:12px;border-top:1px solid var(--line);color:var(--ink)}
  .newsline .flag{display:inline-block;font:700 9px/1 'Space Mono',monospace;padding:4px 7px;border-radius:6px;margin-right:8px;text-transform:uppercase;color:var(--amber);background:rgba(201,138,0,.14)}

  .card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;box-shadow:0 2px 10px rgba(55,0,60,.06)}
  .tick{display:grid;gap:6px;align-items:stretch}
  .gwhead{font:700 9px/1 'Space Mono',monospace;color:var(--muted);text-align:center;padding:2px 0}
  .lblhead{align-self:center}
  .prow{display:contents}
  .pcell{display:flex;flex-direction:column;justify-content:center;border-radius:9px;padding:8px 9px;min-height:50px}
  .pcell.name{background:rgba(55,0,60,.04);border:1px solid var(--line)}
  .pcell.name.hot{border-color:rgba(233,0,82,.4);background:rgba(233,0,82,.06)}
  .pcell .cbadge{font:900 11px/1 'Space Mono',monospace;color:var(--purple)}
  .pcell .cbadge.hot{color:var(--pink)}
  .pcell .cp{font:400 9px/1.25 'Space Mono',monospace;color:var(--muted);margin-top:3px}
  .fcell{align-items:center;text-align:center}
  .fcell.f1,.fcell.f2{color:#0a3d24}.fcell.f3{color:var(--ink)}.fcell.f4,.fcell.f5{color:#fff}
  .fcell.f1{background:var(--f1)}.fcell.f2{background:var(--f2)}.fcell.f3{background:var(--f3)}.fcell.f4{background:var(--f4)}.fcell.f5{background:var(--f5)}
  .fcell .opp{font:700 10px/1.1 'Space Mono',monospace}
  .fcell .fdr{font-weight:900;font-size:15px;margin-top:2px}
  /* matryca kapitana */
  .cmrow{display:flex;gap:10px;flex-wrap:wrap}
  .cmside{flex:1;min-width:150px;display:flex;flex-direction:column;gap:3px;padding:11px 12px;border-radius:12px;border:1px solid var(--line)}
  .cmside.shield{background:rgba(0,166,90,.07);border-left:4px solid var(--green-ink)}
  .cmside.dagger{background:rgba(233,0,82,.06);border-left:4px solid var(--pink)}
  .cmtag{font:700 9px/1 'Space Mono',monospace;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
  .cmname{font-weight:900;font-size:16px;color:var(--purple)}
  .cmmeta{font:400 11px/1.3 'Space Mono',monospace;color:var(--muted)}
  .cmnote{margin-top:9px;font:400 11px/1.5 'Space Mono',monospace;color:var(--ink)}
  /* roadmapa */
  .rmtbl{width:100%;border-collapse:separate;border-spacing:4px;font-family:'Space Mono',monospace}
  .rmtbl th{font:700 9px/1.1 'Space Mono',monospace;color:var(--muted);text-transform:uppercase;padding:4px 6px;text-align:center}
  .rmtbl th:first-child{text-align:left}
  .rmname{background:rgba(55,0,60,.04);border:1px solid var(--line);border-radius:9px;padding:8px 10px;font-weight:800;font-size:13px;color:var(--purple);white-space:nowrap}
  .rmname .cbadge{display:inline-block;font:900 10px/1 'Space Mono',monospace;color:#fff;background:var(--green-ink);border-radius:4px;padding:2px 4px;margin-right:5px}
  .rmname .rmpos{display:block;font:400 9px/1.3 'Space Mono',monospace;color:var(--muted);margin-top:2px}
  .rmc{border-radius:9px;padding:7px 6px;text-align:center;min-width:64px}
  .rmc.f1,.rmc.f2{color:#0a3d24}.rmc.f3{color:var(--ink)}.rmc.f4,.rmc.f5{color:#fff}
  .rmc.f1{background:var(--f1)}.rmc.f2{background:var(--f2)}.rmc.f3{background:var(--f3)}.rmc.f4{background:var(--f4)}.rmc.f5{background:var(--f5)}
  .rmc.rmempty{background:rgba(55,0,60,.03);color:var(--muted)}
  .rmopp{display:block;font:700 10px/1.1 'Space Mono',monospace}
  .rmx{display:block;font-weight:900;font-size:14px;margin-top:3px}
  .rmsum{background:var(--purple);color:var(--green);border-radius:9px;text-align:center;font-weight:900;font-size:14px;padding:7px 8px}
  /* obrona pozycji */
  .cvexp{background:rgba(233,0,82,.06);border:1px solid rgba(233,0,82,.2);border-radius:10px;padding:11px 13px;font:400 12px/1.5 'Space Mono',monospace;color:var(--ink);margin-bottom:12px}
  .cvexp.ok{background:rgba(0,166,90,.07);border-color:rgba(0,166,90,.25)}
  .cvexptag{display:block;font-weight:700;font-size:9px;letter-spacing:.08em;text-transform:uppercase;color:var(--pink);margin-bottom:3px}
  .cvsechdr{font:700 10px/1 'Space Mono',monospace;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin:14px 0 8px}
  .cvrow{padding:9px 0;border-bottom:1px solid var(--line)}
  .cvrow:last-of-type{border-bottom:0}
  .cvhead{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
  .cvname{font-weight:800;font-size:13px;color:var(--purple)}
  .cvname .cvsub{font:400 10px/1 'Space Mono',monospace;color:var(--muted);margin-left:6px}
  .cvgap{font:700 11px/1 'Space Mono',monospace;color:var(--green-ink);white-space:nowrap}
  .cvmeta{display:flex;flex-wrap:wrap;gap:6px 12px;margin-top:5px;font:400 11px/1.4 'Space Mono',monospace;color:var(--muted)}
  .cvcap{font-weight:700}
  .cvcap.cap-diff{color:var(--pink)} .cvcap.cap-same{color:var(--green-ink)}
  .cvchips{display:flex;flex-wrap:wrap;gap:6px}
  .cvchip{display:flex;flex-direction:column;padding:6px 9px;border-radius:9px;font-weight:800;font-size:12px}
  .cvchip.threat{background:rgba(233,0,82,.08);color:var(--pink)}
  .cvchip.prot{background:rgba(0,166,90,.08);color:var(--green-ink)}
  .cvchip.tmpl{background:rgba(55,0,60,.06);color:var(--purple)}
  .cvchip .cvchipm{font:400 9px/1.3 'Space Mono',monospace;color:var(--muted);margin-top:2px}
  .cvfoot{margin-top:12px;font:400 10px/1.5 'Space Mono',monospace;color:var(--muted)}
  /* proponowana jedenastka (Doradca) */
  .xiwrap{background:var(--card);border:1px solid var(--line);border-radius:16px;overflow:hidden;box-shadow:0 2px 10px rgba(55,0,60,.05)}
  .xibar{display:flex;justify-content:space-between;align-items:center;padding:11px 14px;background:linear-gradient(120deg,var(--purple),var(--purple2))}
  .xiform{font:700 11px/1 'Space Mono',monospace;letter-spacing:.06em;color:rgba(255,255,255,.85);text-transform:uppercase}
  .xisum{font-weight:900;font-size:16px;color:var(--green)} .xisum small{font:400 10px 'Space Mono',monospace;color:rgba(255,255,255,.6)}
  .xipitch{background:repeating-linear-gradient(0deg,var(--pitch1) 0 40px,var(--pitch2) 40px 80px);padding:12px 8px}
  .xirow{display:flex;justify-content:center;gap:6px;flex-wrap:wrap;margin:5px 0}
  .xip{position:relative;width:96px;background:#fff;border-radius:10px;padding:7px 5px;display:flex;flex-direction:column;align-items:center;gap:3px;box-shadow:0 1px 4px rgba(0,0,0,.15)}
  .xibadge{position:absolute;top:-6px;right:-6px;width:19px;height:19px;border-radius:50%;font:900 10px/19px 'Archivo';text-align:center;color:var(--purple)}
  .xibadge.c{background:var(--green)} .xibadge.v{background:var(--cyan)}
  .xinm{font-weight:800;font-size:12px;color:var(--purple);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
  .xifx{font:700 8px/1 'Space Mono',monospace;padding:2px 5px;border-radius:5px}
  .xifx.f1,.xifx.f2{color:#0a3d24}.xifx.f3{color:var(--ink)}.xifx.f4,.xifx.f5{color:#fff}
  .xifx.f1{background:var(--f1)}.xifx.f2{background:var(--f2)}.xifx.f3{background:var(--f3)}.xifx.f4{background:var(--f4)}.xifx.f5{background:var(--f5)}
  .xipts{font-weight:900;font-size:16px;color:var(--green-ink)}
  .xiup{font:700 7px/1 'Space Mono',monospace;color:var(--pink);background:rgba(233,0,82,.1);padding:2px 4px;border-radius:4px}
  .xirange{font:700 8px/1 'Space Mono',monospace;color:var(--muted)}
  .xioutlook{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:9px 14px;background:rgba(0,166,90,.06);border-bottom:1px solid var(--line)}
  .xolab{font:700 9px/1 'Space Mono',monospace;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
  .xorange{font-size:14px;color:var(--purple)} .xorange b{color:var(--green-ink);font-size:16px} .xosep{color:var(--muted)}
  .xomed{font:400 11px/1 'Space Mono',monospace;color:var(--muted)}
  /* rozkład w szczegółach zawodnika */
  .distbar{display:flex;gap:6px;margin:12px 0 4px;flex-wrap:wrap}
  .distseg{flex:1;min-width:70px;background:rgba(55,0,60,.04);border:1px solid var(--line);border-radius:9px;padding:8px 10px;display:flex;flex-direction:column;gap:2px}
  .distseg.mid{background:rgba(0,166,90,.07);border-color:rgba(0,166,90,.2)}
  .distseg.haul{background:rgba(233,0,82,.06);border-color:rgba(233,0,82,.2)}
  .distk{font:400 9px/1 'Space Mono',monospace;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
  .distv{font-weight:900;font-size:18px;color:var(--purple)}
  /* hold % w obronie pozycji */
  .cvright{display:flex;align-items:center;gap:8px;white-space:nowrap}
  .cvhold{font:900 11px/1 'Space Mono',monospace;padding:3px 7px;border-radius:6px}
  .cvhold.good{background:rgba(0,166,90,.12);color:var(--green-ink)}
  .cvhold.mid{background:rgba(255,176,32,.15);color:#9a6b00}
  .cvhold.bad{background:rgba(233,0,82,.1);color:var(--pink)}
  /* zakładka Skuteczność */
  .accgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin-bottom:6px}
  .acckpi{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;box-shadow:0 2px 8px rgba(55,0,60,.05)}
  .acck{font:700 10px/1 'Space Mono',monospace;text-transform:uppercase;letter-spacing:.05em;color:var(--muted)}
  .accv{font-weight:900;font-size:30px;color:var(--purple);margin:6px 0 2px}
  .accu{font:400 11px/1.3 'Space Mono',monospace;color:var(--muted)}
  .acctbl .accc{text-align:center;font-family:'Space Mono',monospace;font-weight:800;background:rgba(55,0,60,.03);border-radius:8px;padding:8px 6px}
  .acctbl .accc.pos{color:var(--green-ink)} .acctbl .accc.neg{color:var(--pink)}
  .recbanner{display:flex;align-items:center;gap:10px;flex-wrap:wrap;background:linear-gradient(120deg,rgba(0,166,90,.12),rgba(0,255,135,.08));border:1px solid rgba(0,166,90,.3);border-radius:12px;padding:11px 14px;margin-bottom:12px;font:600 12px/1.4 'Space Mono',monospace;color:var(--ink)}
  .recundo{margin-left:auto;border:1px solid var(--green-ink);background:#fff;color:var(--green-ink);font:800 11px 'Archivo';padding:6px 12px;border-radius:8px;cursor:pointer}
  /* predykcje meczów */
  .mpgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px;margin-bottom:14px}
  .mpred{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:11px 12px;box-shadow:0 2px 8px rgba(55,0,60,.05)}
  .mpteams{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:8px}
  .mpt{font-weight:900;font-size:14px;color:var(--purple)} .mpt.a{text-align:right}
  .mpsc{font:900 13px/1 'Space Mono',monospace;color:var(--green-ink);background:rgba(0,166,90,.08);padding:3px 7px;border-radius:6px}
  .wdlbar{display:flex;height:20px;border-radius:6px;overflow:hidden;font:800 9px/20px 'Space Mono',monospace;color:#fff;text-align:center}
  .wdl.h{background:var(--green-ink)} .wdl.d{background:#9aa0a6} .wdl.a{background:var(--pink)}
  .mpmeta{display:flex;justify-content:space-between;gap:6px;margin-top:7px;font:400 10px/1.3 'Space Mono',monospace;color:var(--muted)}
  .mpg{font-weight:700;color:var(--ink);white-space:nowrap}
  /* predyktor cen */
  .pwcols{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  @media(max-width:560px){.pwcols{grid-template-columns:1fr}}
  .pwhdr{font:800 11px/1 'Space Mono',monospace;text-transform:uppercase;letter-spacing:.05em;margin-bottom:8px}
  .pwhdr.up{color:var(--green-ink)} .pwhdr.dn{color:var(--pink)}
  .pwrow{display:flex;align-items:center;gap:8px;padding:6px 0;border-bottom:1px solid var(--line)}
  .pwnm{font-weight:800;font-size:12px;color:var(--purple);flex:1;min-width:0}
  .pwnm .pwt{display:block;font:400 9px/1.2 'Space Mono',monospace;color:var(--muted)}

<script>

const FDR_LABEL = "Trudność rywala (FDR) z oficjalnego API FPL · xPts to model heurystyczny, nie oficjalny.";
let DATA=null, CUR="brief", SEL=null, EDIT=false, BANK=0;

/* nadpisania składu (lokalne, GitHub Pages) — rozwiązują brak aktualizacji po transferach */
function ovKey(){ return "fplco_ov_"+((DATA&&DATA.entry&&DATA.entry.team_id)||"x"); }
function ovGwKey(){ return "fplco_ovgw_"+((DATA&&DATA.entry&&DATA.entry.team_id)||"x"); }
function bankKey(){ return "fplco_bank_"+((DATA&&DATA.entry&&DATA.entry.team_id)||"x"); }
function curGw(){ return (DATA&&DATA.gw&&DATA.gw.next)||0; }
function loadOv(){ try{return JSON.parse(localStorage.getItem(ovKey())||"[]");}catch(e){return [];} }
function saveOv(o){ try{localStorage.setItem(ovKey(),JSON.stringify(o)); localStorage.setItem(ovGwKey(),String(curGw()));}catch(e){} }
// po deadline (nowy GW) skasuj przeterminowane nadpisania — serwer ma już realny skład
function expireStaleOverrides(){
  try{
    const stamp=parseInt(localStorage.getItem(ovGwKey())||"0",10);
    const now=curGw();
    if(stamp && now && now>stamp){
      localStorage.removeItem(ovKey()); localStorage.removeItem(ovGwKey()); localStorage.removeItem(bankKey());
      return true;  // wygasło — skład wraca do danych z serwera
    }
  }catch(e){}
  return false;
}
function baseBank(){ return (DATA.planner&&DATA.planner.bank!=null)?DATA.planner.bank:(DATA.entry.bank||0); }
function loadBank(){ try{const v=localStorage.getItem(bankKey()); return v!==null?parseFloat(v):baseBank();}catch(e){return baseBank();} }
function saveBank(v){ BANK=Math.round(v*10)/10; try{localStorage.setItem(bankKey(),String(BANK));}catch(e){} }
function effectiveSquad(){
  const ov=loadOv(); const sq=(DATA.squad||[]).map(p=>({...p}));
  ov.forEach(m=>{
    const i=sq.findIndex(p=>p.id===m.out); if(i<0)return;

function normCdf(z){ // przybliżenie dystrybuanty N(0,1)
  const t=1/(1+0.2316419*Math.abs(z));
  const d=0.3989423*Math.exp(-z*z/2);
  let p=d*t*(0.3193815+t*(-0.3565638+t*(1.781478+t*(-1.821256+t*1.330274))));
  return z>0?1-p:p;
}
// przeliczenie analityki Doradcy na podstawie efektywnego składu (po transferach w apce)
function recomputeBrief(sq){
  const FORMS=[[3,4,3],[3,5,2],[4,3,3],[4,4,2],[4,5,1],[5,3,2],[5,4,1],[5,2,3]];
  const byPos=p=>sq.filter(x=>x.pos===p).sort((a,b)=>b.xpts-a.xpts);
  const G=byPos("GK"),D=byPos("DEF"),M=byPos("MID"),F=byPos("FWD");
  if(!G.length||D.length<3||F.length<1) return null;
  let best=null;
  for(const [d,m,f] of FORMS){
    if(D.length<d||M.length<m||F.length<f) continue;
    const xi=[G[0],...D.slice(0,d),...M.slice(0,m),...F.slice(0,f)];
    const tot=xi.reduce((a,p)=>a+p.xpts,0);
    if(!best||tot>best.tot) best={tot,xi,form:`${d}-${m}-${f}`};
  }
  if(!best) return null;
  const xiIds=new Set(best.xi.map(p=>p.id));
  const bySt=[...best.xi].sort((a,b)=>b.xpts-a.xpts);
  const capId=bySt[0]?.id, viceId=bySt[1]?.id;
  const posOrd={GK:0,DEF:1,MID:2,FWD:3};
  const xi=[...best.xi].sort((a,b)=>(posOrd[a.pos]-posOrd[b.pos])||b.xpts-a.xpts).map(p=>({
    name:p.name,pos:p.pos,team:p.team,xpts:p.xpts,
    opp:p.next?.opp||"",ven:p.next?.ven||"",fdr:p.next?.fdr||3,
    is_captain:p.id===capId,is_vice:p.id===viceId,
    was_benched:p.on_bench,floor:p.floor,ceiling:p.ceiling,haul:p.haul,
  }));
  const xi_total=Math.round((best.tot+(bySt[0]?.xpts||0))*10)/10; // kapitan ×2
  // kapitan-optymalizator
  const curCap=sq.find(p=>p.is_captain);
  const captain={current:curCap?.name||bySt[0]?.name,current_xpts:curCap?.xpts||bySt[0]?.xpts,
    best:bySt[0]?.name,best_xpts:bySt[0]?.xpts,optimal:(curCap?curCap.id===capId:true),
    gain:Math.round(((bySt[0]?.xpts||0)-(curCap?.xpts||bySt[0]?.xpts||0))*10)/10};
  // matryca Tarcza/Sztylet
  const own=p=>parseFloat(p.selected_by||0)||0;
  const shield=best.xi.reduce((a,p)=>(own(p)*0.04+p.xpts)>(own(a)*0.04+a.xpts)?p:a,best.xi[0]);
  const dCands=best.xi.filter(p=>own(p)<15); const dagger=(dCands.length?dCands:best.xi).reduce((a,p)=>p.xpts>a.xpts?p:a,(dCands[0]||best.xi[0]));
  const cm={shield:{name:shield.name,xpts:shield.xpts,own:shield.selected_by,opp:shield.next?.opp||"",ven:shield.next?.ven||""},
    dagger:{name:dagger.name,xpts:dagger.xpts,own:dagger.selected_by,opp:dagger.next?.opp||"",ven:dagger.next?.ven||""},
    same:shield.name===dagger.name};
  // rozkład XI (przybliżenie normalne: suma wariancji, kapitan ×2 → wariancja ×4)
  let outlook=null;
  if(best.xi.every(p=>p.sd!=null)){
    const mean=best.tot+(bySt[0]?.xpts||0);
    let varr=best.xi.reduce((a,p)=>a+(p.sd*p.sd),0);
    if(bySt[0]?.sd) varr+=3*bySt[0].sd*bySt[0].sd; // podwojenie kapitana
    const sd=Math.sqrt(varr);
    outlook={p10:Math.round(mean-1.2816*sd),p50:Math.round(mean),p90:Math.round(mean+1.2816*sd),
      mean:Math.round(mean*10)/10,sd:Math.round(sd*10)/10,captain:bySt[0]?.name};
  }
  // ustawienie: zamiany względem obecnego on_bench
  const startNow=new Set(sq.filter(p=>!p.on_bench).map(p=>p.id));
  const bringIn=best.xi.filter(p=>!startNow.has(p.id));
  const sitOut=sq.filter(p=>startNow.has(p.id)&&!xiIds.has(p.id));
  const swaps=bringIn.map((pin,i)=>{const pout=sitOut[i];return pout?{
    in:{name:pin.name,pos:pin.pos,xpts:pin.xpts,reason:reasonFor(pin)},
    out:{name:pout.name,pos:pout.pos,xpts:pout.xpts},
    delta:Math.round((pin.xpts-pout.xpts)*10)/10}:null;}).filter(Boolean);
  const bench=sq.filter(p=>!xiIds.has(p.id)).sort((a,b)=>b.xpts-a.xpts)
    .map(p=>({name:p.name,pos:p.pos,xpts:p.xpts}));
  const highlights=[...best.xi].sort((a,b)=>b.xpts-a.xpts).slice(0,3).map(p=>({
    name:p.name,pos:p.pos,xpts:p.xpts,opp:p.next?.opp||"",ven:p.next?.ven||"",reason:reasonFor(p)}));
  const lineup={optimal:swaps.length===0,optimal_formation:best.form,
    current_formation:(DATA.brief?.lineup?.current_formation||best.form),
    optimal_xpts:Math.round(best.tot*10)/10,current_xpts:Math.round(best.tot*10)/10,
    gain:Math.round(swaps.reduce((a,s)=>a+s.delta,0)*10)/10,
    swaps,bench_order:bench,highlights,xi,xi_total};
  return {...DATA.brief,captain,captain_matrix:cm,gw_outlook:outlook,lineup,_recomputed:true};
}
function reasonFor(p){ // krótkie uzasadnienie z terminarza/formy
  const f=p.next?.fdr||3;
  if(f<=2) return "łatwy terminarz — sprzyja punktom";
  if(f>=4) return "trudny mecz, ale najwyższe xPts na pozycji";
  return "solidny wybór wg prognozy";
}

/* ---------- sparkline formy (ostatnie 5 GW) ---------- */
function sparkline(vals){
  if(!vals||!vals.length) return "";
  const w=84,h=24,max=Math.max(...vals,1),min=Math.min(...vals,0);
  const rng=(max-min)||1, step=w/Math.max(vals.length-1,1);
  const pts=vals.map((v,i)=>`${(i*step).toFixed(1)},${(h-2-((v-min)/rng)*(h-4)).toFixed(1)}`).join(" ");
  const dots=vals.map((v,i)=>`<circle cx="${(i*step).toFixed(1)}" cy="${(h-2-((v-min)/rng)*(h-4)).toFixed(1)}" r="2" fill="var(--green-ink)"/>`).join("");
  return `<svg width="${w}" height="${h}" viewBox="0 0 ${w} ${h}" style="overflow:visible"><polyline points="${pts}" fill="none" stroke="var(--green-ink)" stroke-width="1.5"/>${dots}</svg>`;
}

  const rows={GK:[],DEF:[],MID:[],FWD:[]};
  xi.forEach(p=>rows[p.pos]?.push(p));
  const st = s => s==='a'?'a':(s==='d'?'d':'i');
  const card = p=>`<button class="p ${SEL===p.id?'sel':''} ${p.swapped?'swp':''}" data-id="${p.id}" title="${p.name}">
      ${p.is_captain?'<span class="badge c">C</span>':p.is_vice?'<span class="badge v">V</span>':''}
      <span class="line"><span class="dot ${st(p.status)}"></span><span class="nm">${p.name}</span></span>
      <span class="fx">${p.next?p.next.opp+" ("+p.next.ven+")":"—"}</span>
      <span class="pts">${(p.xpts||0).toFixed(1)}</span></button>`;
  const pitch = ['GK','DEF','MID','FWD'].map(r=>`<div class="rowline">${rows[r].map(card).join("")}</div>`).join("");
  const benchHtml = bench.map(card).join("");
  const tot = xi.reduce((s,p)=>s+(p.xpts||0)*(p.is_captain?2:1),0);
  const ovN = loadOv().length;
  const bank=BANK;

  el("app").innerHTML = `
    <div class="hero">
      <div class="tot"><div class="lab">Prognoza jedenastki (z C ×2)</div>
        <div class="big">${tot.toFixed(1)}</div>
        <div class="sub">${DATA.gw.name}${ovN?` · ${ovN} lokalnych zmian`:''}</div></div>
      <div class="stats">
        <div class="stat"><div class="k">Bank</div><div class="v">£${(bank||0).toFixed(1)}</div></div>
        <div class="stat"><div class="k">Wartość</div><div class="v">${DATA.entry.value!=null?'£'+DATA.entry.value.toFixed(1):'—'}</div></div>
      </div>
    </div>
    <div class="editbar">
      <button class="editbtn ${EDIT?'on':''}" id="editToggle">${EDIT?'✓ Gotowe':'✎ Edytuj skład (transfery)'}</button>
      ${ovN?`<button class="editbtn ghost" id="editReset">Cofnij zmiany (${ovN})</button>`:''}
    </div>
    ${EDIT?`<div class="edithint">Tryb edycji: kliknij zawodnika, żeby go wymienić. Zmiany zapisują się lokalnie w przeglądarce — użyj tego, gdy API jeszcze nie pokazuje Twoich transferów.</div>`:''}
    <div class="h"><span class="no">01</span><span class="t">Boisko</span><span class="d">${EDIT?'kliknij → wymień zawodnika':'kliknij zawodnika → warstwy ↓'}</span></div>
    <div class="pitch">${pitch}<div class="bench-strip">${benchHtml}</div></div>
    <div id="detail"></div>`;

  el("editToggle").onclick=()=>{EDIT=!EDIT;SEL=null;renderSquad();};
  if(el("editReset")) el("editReset").onclick=()=>{saveOv([]);saveBank(baseBank());SEL=null;renderSquad();};
  el("app").querySelectorAll(".p").forEach(b=>b.onclick=()=>{
    const id=+b.dataset.id;
    if(EDIT){ openSwap(id); }
    else { SEL=id; renderSquad(); document.getElementById("detail").scrollIntoView({behavior:"smooth",block:"nearest"}); }
  });

function openSwap(outId){
  SEL=outId;
  const squad=effectiveSquad();
  const out=squad.find(p=>p.id===outId); if(!out) return;
  const bank=BANK;
  const budget=out.price+bank;
  const ownedIds=new Set(squad.map(p=>p.id));
  // liczba zawodników z każdego klubu (po odjęciu wymienianego — zwalnia slot)
  const clubCount={};
  squad.forEach(p=>{ if(p.id!==outId) clubCount[p.team]=(clubCount[p.team]||0)+1; });
  const clubOk=c=> (clubCount[c.team]||0) < 3;   // OUT już odjęty, więc próg to 3
  const cands=(DATA.pool||[]).filter(c=>c.et===out.etype && !ownedIds.has(c.id))
    .sort((a,b)=>b.xpts_h-a.xpts_h);
  const list=cands.slice(0,60).map(c=>{
    const aff=c.price<=budget+1e-9;
    const okClub=clubOk(c);
    const blocked=!okClub;
    return `<div class="swrow ${(aff&&okClub)?'':'na'}" data-in="${c.id}" data-aff="${(aff&&okClub)?1:0}">
      <span class="swnm">${c.name}<span class="swpos">${c.team} · £${c.price.toFixed(1)} · ${c.own}%${blocked?' · <b style="color:var(--pink)">limit 3/klub</b>':''}</span></span>
      <span class="mini-fx f${Math.max(1,Math.min(5,c.next?c.next.fdr:3))}">${c.next?c.next.opp+" ("+c.next.ven+")":"—"}</span>
      <span class="swxp">h${c.xpts_h}</span></div>`;}).join("");
  document.getElementById("detail").innerHTML=`
    <div class="detail">
      <div class="dhead"><h2>Wymień: ${out.name}</h2>
        <div class="dproj"><div class="l">budżet</div><div class="n" style="font-size:22px">£${budget.toFixed(1)}</div></div></div>
      <input id="swSearch" placeholder="Szukaj zawodnika…" style="width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:10px;font:600 13px 'Archivo';color:var(--purple);margin-bottom:10px">
      <div id="swList" class="swlist">${list}</div>
    </div>`;
  const doSwap=inId=>{
    const out=effectiveSquad().find(p=>p.id===outId);
    const inp=(DATA.pool||[]).find(c=>c.id===inId);
    if(out&&inp){ const sell=sellPrice(out.price,out.price); saveBank(Math.max(0, BANK + sell - inp.price)); }
    const ov=loadOv().filter(m=>m.out!==outId); ov.push({out:outId,in:inId}); saveOv(ov); EDIT=true; renderSquad();
  };
  document.getElementById("swList").querySelectorAll(".swrow").forEach(r=>r.onclick=()=>{
    if(r.dataset.aff!=="1") return;   // budżet lub limit 3/klub — nie pozwól
    doSwap(+r.dataset.in);
  });
  document.getElementById("swSearch").oninput=e=>{
    const q=e.target.value.toLowerCase();
    document.getElementById("swList").querySelectorAll(".swrow").forEach(r=>{
      r.style.display = r.querySelector(".swnm").textContent.toLowerCase().includes(q)?"":"none";});
  };
  document.getElementById("detail").scrollIntoView({behavior:"smooth",block:"nearest"});
}

      ${(p.floor!=null&&p.ceiling!=null)?`<div class="distbar">

      </div>`:''}

function renderPlanner(){
  const P0=DATA.planner;
  if(!P0){ el("app").innerHTML=`<div class="card">Brak danych planera — odśwież data.json.</div>`; return; }
  const fdrC=f=>"f"+Math.max(1,Math.min(5,f||3));
  // przeliczanie po transferach w edytorze
  const ovP=hasOverrides();
  let P=P0, planBanner="";
  if(ovP){
    const eff=effectiveSquad();
    const ids=new Set(eff.map(p=>p.id));
    const myTeams=new Set(eff.map(p=>p.team));
    P=JSON.parse(JSON.stringify(P0));
    // owned flags
    (P.differentials||[]).forEach(v=>{ if('id' in v) v.owned=ids.has(v.id); });
    (P.value_picks||[]).forEach(v=>{ if('id' in v) v.owned=ids.has(v.id); });
    if(P.price_watch){
      (P.price_watch.rises||[]).forEach(x=>x.owned=ids.has(x.id));
      (P.price_watch.falls||[]).forEach(x=>x.owned=ids.has(x.id));
      // moi pod presją: z efektywnego składu
      P.price_watch.mine=eff.filter(p=>p.price_pred&&p.price_pred.dir!=='stable')
        .map(p=>({name:p.name,dir:p.price_pred.dir,score:p.price_pred.score,net:p.price_pred.net}));
    }
    // moje drużyny w DGW/BGW
    (P.dgw_bgw||[]).forEach(d=>{
      d.my_doubles=[...new Set((d.doubles||[]).filter(t=>myTeams.has(t)))];
      d.my_blanks=[...new Set((d.blanks||[]).filter(t=>myTeams.has(t)))];
    });
    // chip Bench Boost przeliczony
    const bb=computeChipBB(eff);
    if(P.chips_opt) P.chips_opt.bench_boost=bb||P.chips_opt.bench_boost;
    // plan wieloetapowy przeliczony
    const gws=[...new Set(eff.flatMap(p=>(p.roadmap||[]).map(r=>r.gw)))].sort((a,b)=>a-b).slice(0,5);
    const newPlan=planTransfersJS(eff, DATA.pool||[], Math.round((P.bank||0)*10), 1, gws);
    if(newPlan) P.transfer_plan=newPlan;
    planBanner=`<div class="recbanner">⟳ Planer przeliczony po Twoich transferach (${loadOv().length}). Plan, chipy, różnicowi i ceny uwzględniają nowy skład. <button class="recundo" onclick="editReset()">Cofnij</button></div>`;
  }

  // chipy
  const chips=(P.chips||[]).map(c=>`<div class="advcard ${c.ready?'ok':'warn'}"><div class="ai">${c.ready?'★':'·'}</div>
    <div class="ab"><div class="at">${c.chip}</div><div class="ap">${c.reason}</div></div></div>`).join("");

  // optymalizator chipów (model)
  const CO=P.chips_opt||{};
  const chipCard=(icon,title,body,gw,dgw)=>`<div class="chipopt">
      <div class="chipicon">${icon}</div>

    planHtml=`

/* ---------- SYMULATOR „co jeśli" (z zasadą sprzedaży FPL) ---------- */
function sellPrice(purchase, current){
  const p=Math.round(purchase*10), c=Math.round(current*10);
  if(c<=p) return c/10;                 // spadek/bez zmian -> cena bieżąca
  return (p + Math.floor((c-p)/2))/10;  // wzrost -> zakup + połowa wzrostu (w dół)
}
function renderRoadmap(){
  const squad=effectiveSquad();
  const maxN=Math.max(1,...squad.map(p=>(p.roadmap||[]).length));
  const gwLabels=[];
  for(const p of squad){ (p.roadmap||[]).forEach((r,i)=>{ if(gwLabels[i]==null) gwLabels[i]="GW"+r.gw; }); }
  const head=Array.from({length:maxN},(_,i)=>`<th>${gwLabels[i]||("+"+(i+1))}</th>`).join("");
  const order={GK:0,DEF:1,MID:2,FWD:3};
  const rows=[...squad].sort((a,b)=>(order[a.pos]-order[b.pos])||((b.on_bench?0:1)-(a.on_bench?0:1)))
    .map(p=>{
      const cells=[];
      for(let i=0;i<maxN;i++){
        const r=(p.roadmap||[])[i];
        cells.push(r
          ? `<td class="rmc ${fdrClass(r.fdr)}"><span class="rmopp">${r.opp} (${r.ven})</span><span class="rmx">${r.xpts.toFixed(1)}</span></td>`
          : `<td class="rmc rmempty">—</td>`);
      }
      const sum=(p.roadmap||[]).reduce((a,r)=>a+r.xpts,0);
      return `<tr><td class="rmname">${p.is_captain?'<span class="cbadge">C</span>':''}${p.name}
        <span class="rmpos">${p.pos}${p.on_bench?' · ławka':''}</span></td>${cells.join("")}
        <td class="rmsum">${sum.toFixed(1)}</td></tr>`;
    }).join("");
  el("app").innerHTML=`
    <div class="h"><span class="no">01</span><span class="t">Roadmapa — projekcja xPts na ${maxN} ${maxN===1?'kolejkę':'kolejek'}</span>
      <span class="d">kolor = FDR · suma = łączne xPts w horyzoncie</span></div>
    <div class="card" style="overflow-x:auto;padding:10px">
      <table class="rmtbl"><thead><tr><th>Zawodnik</th>${head}<th>Σ</th></tr></thead><tbody>${rows}</tbody></table>
    </div>
    <div class="foot" style="margin-top:10px">Planowanie transferów: szukaj graczy z łatwym terminarzem (zielone) w horyzoncie, żeby nie palić −4 na zmianę już za kolejkę-dwie. Dodani lokalnie zawodnicy też mają roadmapę.</div>`;
}

function renderSim(){
  const pool=DATA.pool||[];
  const squad=effectiveSquad();
  const bank=(DATA.planner&&DATA.planner.bank)||0;
  const outOpts=squad.map(p=>`<option value="${p.id}">${p.name} (${p.pos}, £${p.price.toFixed(1)}, xPts h${p.xpts_h??'?'})</option>`).join("");
  el("app").innerHTML = `
    <div class="h"><span class="no">01</span><span class="t">Symulator „co jeśli"</span><span class="d">bank: £${bank.toFixed(1)}</span></div>
    <div class="card">
      <div class="simctl"><label>Sprzedajesz (OUT)</label>
        <select id="simOut">${outOpts}</select></div>
      <div class="simctl"><label>Cena zakupu OUT (dla ceny sprzedaży)</label>
        <input id="simBuy" type="number" step="0.1" style="width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:10px;font:700 13px 'Archivo';color:var(--purple)"></div>
      <div class="simctl"><label>Kupujesz (IN) — w budżecie, ta sama pozycja</label>
        <select id="simIn"></select></div>
      <label class="simchk"><input type="checkbox" id="simFree" checked> To darmowy transfer (bez −4)</label>
      <div id="simResult" class="simres"></div>
    </div>
    <p class="foot" style="margin-top:14px;border:0">Cena sprzedaży wg reguły FPL: przy wzroście ceny dostajesz zakup + połowę wzrostu (zaokrągloną w dół), więc +0.1 nie daje zysku. Zysk xPts liczony na 3 kolejki (h).</p>`;

  const byId=Object.fromEntries(squad.map(p=>[String(p.id),p]));
  const outSel=el("simOut"), buyInp=el("simBuy"), inSel=el("simIn"), freeChk=el("simFree"), res=el("simResult");

  function fillIn(){
    const out=byId[outSel.value]; if(!out){inSel.innerHTML="";return;}
    if(!buyInp.value) buyInp.value=out.price.toFixed(1);   // domyślnie = cena bieżąca
    const sp=sellPrice(parseFloat(buyInp.value)||out.price, out.price);
    const budget=sp+bank;
    const ownedIds=new Set(squad.map(p=>p.id));
    const clubCount={};
    squad.forEach(p=>{ if(p.id!==out.id) clubCount[p.team]=(clubCount[p.team]||0)+1; });
    const cands=pool.filter(c=>c.et===out.etype && !ownedIds.has(c.id) && c.price<=budget+1e-9
        && (clubCount[c.team]||0)<3)   // limit 3 z jednego klubu (OUT już odjęty)
      .sort((a,b)=>b.xpts_h-a.xpts_h).slice(0,40);
    inSel.innerHTML=cands.map(c=>`<option value="${c.id}">${c.name} (${c.team}, £${c.price.toFixed(1)}, h${c.xpts_h}, ${c.own}%)</option>`).join("")
      || `<option value="">brak kandydatów w budżecie £${budget.toFixed(1)}</option>`;
    calc();
  }
  function calc(){
    const out=byId[outSel.value]; const inp=pool.find(c=>String(c.id)===String(inSel.value));
    if(!out){res.innerHTML="";return;}
    const buy=parseFloat(buyInp.value)||out.price;
    const sp=sellPrice(buy,out.price);
    const budget=sp+bank;
    if(!inp){res.innerHTML=`<div class="simline">Cena sprzedaży ${out.name}: <b>£${sp.toFixed(1)}</b> · budżet na zakup: <b>£${budget.toFixed(1)}</b></div>`;return;}
    const gain=+(inp.xpts_h-(out.xpts_h||0)).toFixed(1);
    const hit=freeChk.checked?0:4, net=+(gain-hit).toFixed(1), good=net>0;
    const affordable=inp.price<=budget+1e-9;
    res.innerHTML=`
      <div class="simline">${out.name} → ${inp.name}</div>
      <div class="simgrid">
        <div><span class="sk">Cena sprzedaży OUT</span><span class="sv">£${sp.toFixed(1)}${sp<out.price?' <span style="color:var(--pink);font-size:11px">(&lt; £'+out.price.toFixed(1)+')</span>':''}</span></div>
        <div><span class="sk">Budżet na IN</span><span class="sv">£${budget.toFixed(1)}</span></div>
        <div><span class="sk">Cena IN</span><span class="sv" style="color:${affordable?'var(--purple)':'var(--pink)'}">£${inp.price.toFixed(1)}${affordable?'':' ✗'}</span></div>
        <div><span class="sk">Zysk xPts (3 kol.)</span><span class="sv" style="color:${gain>0?'var(--green-ink)':'var(--pink)'}">${gain>0?'+':''}${gain}</span></div>
        <div><span class="sk">Koszt (hit)</span><span class="sv">${hit?'−4':'0'}</span></div>
        <div><span class="sk">Zysk netto</span><span class="sv" style="color:${good?'var(--green-ink)':'var(--pink)'};font-size:18px">${net>0?'+':''}${net}</span></div>
      </div>
      <div class="simverdict ${(good&&affordable)?'ok':'no'}">${!affordable?'✗ Nie stać Cię — cena IN przekracza budżet':(good?'✓ Opłacalny na 3 kolejki':'✗ Nie zwraca się w 3 kolejkach')}</div>`;
  }
  outSel.onchange=()=>{buyInp.value="";fillIn();}; buyInp.oninput=fillIn; inSel.onchange=calc; freeChk.onchange=calc;
  fillIn();
}

/* ---------- FDR ---------- */
function computeTicker(xi){
  const groups={};
  xi.forEach(p=>{ const t=p.team; (groups[t]=groups[t]||{team:t,team_full:p.team_full||t,players:[],roadmap:p.roadmap||[]});
    groups[t].players.push(p.name); if((p.roadmap||[]).length>groups[t].roadmap.length) groups[t].roadmap=p.roadmap; });
  const tick=Object.values(groups).map(g=>{
    const fx=(g.roadmap||[]).map(r=>({gw:r.gw,opp:r.opp,ven:r.ven,fdr:r.fdr}));
    const avg=fx.length?Math.round(fx.reduce((a,f)=>a+f.fdr,0)/fx.length*10)/10:null;
    return {team:g.team,team_full:g.team_full,count:g.players.length,players:g.players,fixtures:fx,avg_fdr:avg};
  });
  tick.sort((a,b)=>(b.count-a.count)||((a.avg_fdr||9)-(b.avg_fdr||9)));
  return tick;
}
function renderFDR(){
  const ovF=hasOverrides();
  const ticker = ovF ? computeTicker(effectiveSquad().filter(p=>!p.on_bench)) : DATA.ticker;
  const n = Math.max(...ticker.map(t=>t.fixtures.length),1);
  const cols = `1fr repeat(${n},54px) 50px`;
  const head = `<div class="lblhead"></div>`+Array.from({length:n},(_,i)=>`<div class="gwhead">+${i+1}</div>`).join("")+`<div class="gwhead">Śr.</div>`;
  const avgCol=a=>a==null?'var(--ink)':a<=2.4?'var(--green)':a<=3.1?'var(--amber)':'var(--pink)';
  const rows = ticker.map(t=>{
    const cells = Array.from({length:n},(_,i)=>{const f=t.fixtures[i];
      return f?`<div class="pcell fcell ${fdrClass(f.fdr)}"><span class="opp">${f.opp} (${f.ven})</span><span class="fdr">${f.fdr}</span></div>`
             :`<div class="pcell avg"></div>`;}).join("");
    return `<div class="prow"><div class="pcell name ${t.avg_fdr>3.2?'hot':''}">
        <span class="cbadge ${t.avg_fdr>3.2?'hot':''}">${t.count}× ${t.team}</span>
        <span class="cp">${t.players.join(" · ")}</span></div>${cells}
      <div class="pcell avg"><span class="al">ŚR</span><span class="av" style="color:${avgCol(t.avg_fdr)}">${t.avg_fdr??"—"}</span></div></div>`;
  }).join("");
  // predykcje meczów (model Dixon-Coles)
  const mp=DATA.match_predictions||[];
  const mm=DATA.match_model||{};
  let predHtml="";
  if(mp.length){
    const bar=(ph,pd,pa)=>`<div class="wdlbar">
        <span class="wdl h" style="width:${Math.round(ph*100)}%" title="dom ${Math.round(ph*100)}%">${ph>=0.18?Math.round(ph*100):''}</span>
        <span class="wdl d" style="width:${Math.round(pd*100)}%" title="remis ${Math.round(pd*100)}%">${pd>=0.18?Math.round(pd*100):''}</span>
        <span class="wdl a" style="width:${Math.round(pa*100)}%" title="wyj ${Math.round(pa*100)}%">${pa>=0.18?Math.round(pa*100):''}</span></div>`;
    const cards=mp.map(m=>`<div class="mpred">
        <div class="mpteams"><span class="mpt">${m.home}</span><span class="mpsc">${m.lam_h} – ${m.lam_a}</span><span class="mpt a">${m.away}</span></div>
        ${bar(m.p_home,m.p_draw,m.p_away)}
        <div class="mpmeta"><span>CS: ${m.home} ${Math.round(m.cs_home*100)}% · ${m.away} ${Math.round(m.cs_away*100)}%</span><span class="mpg">Σ goli ${m.goals}</span></div>
      </div>`).join("");
    predHtml=`
      <div class="h"><span class="no">01</span><span class="t">Przewidywane wyniki — ${DATA.gw.name}</span>
        <span class="d">model goli Dixon-Coles · ${mm.fitted?mm.n_matches+' meczów':'prior (za mało meczów)'}</span></div>
      <div class="mpgrid">${cards}</div>
      ${!mm.fitted?`<div class="cvfoot" style="margin-bottom:14px">Za mało rozegranych meczów, by dopasować model z danych — używam priorów z ocen siły FPL. Po kilku kolejkach model przejdzie na realne wyniki.</div>`:''}`;
  }

  el("app").innerHTML = `
    ${ovF?'<div class="recbanner">⟳ Terminarz przeliczony po Twoich transferach. <button class="recundo" onclick="editReset()">Cofnij</button></div>':''}
    ${predHtml}
    <div class="h"><span class="no">02</span><span class="t">Terminarz FDR — kolejne ${n} kolejek</span><span class="d">pogrupowane po klubie</span></div>
    <div class="card"><div class="tick" style="grid-template-columns:${cols}">${head}${rows}</div></div>
    <div class="legend"><span>FDR:</span><span class="sw f2">1–2</span><span class="sw f3">3</span><span class="sw f4">4</span><span class="sw f5">5</span></div>`;
}

/* ---------- KONCENTRACJA ---------- */
// ── przeliczanie Planera po transferach (owned, chipy BB, plan wieloetapowy) ──
function bestXiValueJS(players, gw){
  const by={1:[],2:[],3:[],4:[]};
  players.forEach(p=>{ (by[p.et]=by[p.et]||[]).push((p.gwx[gw]||0)); });
  [1,2,3,4].forEach(k=>by[k].sort((a,b)=>b-a));
  if(!by[1].length||by[2].length<3||by[4].length<1) return 0;
  let best=0;
  for(let d=3;d<=5;d++) for(let f=1;f<=3;f++){ const m=10-d-f;
    if(m<2||m>5||by[2].length<d||by[3].length<m||by[4].length<f) continue;
    const sum=(a,n)=>a.slice(0,n).reduce((x,y)=>x+y,0);
    const tot=by[1][0]+sum(by[2],d)+sum(by[3],m)+sum(by[4],f);
    if(tot>best)best=tot;
  }
  return best;
}
function planTransfersJS(squad, pool, bankTenths, startFt, gws){
  if(!squad.length||!gws.length) return null;
  const mkp=p=>({id:p.id,et:p.etype||p.et,team:p.team,price:Math.round(p.price*10),
    gwx:Object.fromEntries((p.roadmap||[]).map(r=>[r.gw,r.xpts])),name:p.name});
  const sq=squad.map(mkp); const sqids=new Set(sq.map(p=>p.id));
  const poolp=pool.filter(c=>!sqids.has(c.id)&&c.roadmap&&c.roadmap.length).map(mkp);
  const byPos={1:[],2:[],3:[],4:[]};
  poolp.forEach(c=>{(byPos[c.et]=byPos[c.et]||[]).push(c);});
  const hznAll=(p,fi)=>gws.slice(fi).reduce((a,g)=>a+(p.gwx[g]||0),0);
  [1,2,3,4].forEach(k=>byPos[k].sort((a,b)=>hznAll(b,0)-hznAll(a,0)));
  const cc0={}; sq.forEach(p=>cc0[p.team]=(cc0[p.team]||0)+1);
  let beam=[{squad:Object.fromEntries(sq.map(p=>[p.id,p])),bank:bankTenths,ft:Math.min(5,Math.max(1,startFt)),cum:0,hits:0,log:[]}];
  const B=6;
  gws.forEach((gw,gi)=>{
    const nxt=[];
    beam.forEach(st=>{
      const smap=st.squad; const cc={}; Object.values(smap).forEach(p=>cc[p.team]=(cc[p.team]||0)+1);
      const weak={}; Object.values(smap).forEach(p=>{ if(!(p.et in weak)||hznAll(p,gi)<hznAll(weak[p.et],gi)) weak[p.et]=p; });
      const cand=[];
      Object.values(weak).forEach(outp=>{ const sell=outp.price;
        (byPos[outp.et]||[]).slice(0,12).forEach(inp=>{
          if(inp.id in smap) return;
          if(inp.price>st.bank+sell) return;
          if(inp.team!==outp.team && (cc[inp.team]||0)>=3) return;
          const gain=hznAll(inp,gi)-hznAll(outp,gi);
          if(gain>0.3) cand.push([gain,outp,inp]);
        });
      });
      cand.sort((a,b)=>b[0]-a[0]);
      const opts=[["hold",null]]; cand.slice(0,4).forEach(c=>opts.push(["move",[c[1],c[2]]]));
      opts.forEach(([kind,mv])=>{
        const ns={squad:{...smap},bank:st.bank,ft:st.ft,cum:st.cum,hits:st.hits,log:[...st.log]};
        let moved=[];
        if(kind==="move"){ const[outp,inp]=mv; delete ns.squad[outp.id]; ns.squad[inp.id]=inp;
          ns.bank=ns.bank+outp.price-inp.price; const hit=Math.max(0,1-ns.ft)*4;
          ns.ft=Math.min(5,Math.max(0,ns.ft-1)+1); ns.cum-=hit; ns.hits+=hit;
          moved=[{out:outp.name,in:inp.name,gain:Math.round((hznAll(inp,gi)-hznAll(outp,gi))*10)/10}];
        } else ns.ft=Math.min(5,ns.ft+1);
        const gwval=bestXiValueJS(Object.values(ns.squad),gw); ns.cum+=gwval;
        ns.log.push({gw,action:kind==="move"?"transfer":"hold",moves:moved,ft_after:ns.ft,
          bank_after:Math.round(ns.bank/10*10)/10,gw_xpts:Math.round(gwval*10)/10,
          hit:(moved.length?Math.max(0,1-st.ft)*4:0)});
        nxt.push(ns);
      });
    });
    nxt.sort((a,b)=>b.cum-a.cum); beam=nxt.slice(0,B);
  });
  const best=beam[0];
  const start=Object.fromEntries(sq.map(p=>[p.id,p]));
  const base=gws.reduce((a,g)=>a+bestXiValueJS(Object.values(start),g),0);
  return {horizon:gws.length,gws,start_bank:Math.round(bankTenths/10*10)/10,start_ft:Math.min(5,Math.max(1,startFt)),
    steps:best.log,total_value:Math.round(best.cum*10)/10,baseline_value:Math.round(base*10)/10,
    gain_vs_hold:Math.round((best.cum-base)*10)/10,total_hits:best.hits};
}
function computeChipBB(squad){
  const rw={nailed:1,solid:0.9,risk:0.6,doubt:0.35,unknown:0.8};
  const scan={};
  squad.forEach(p=>{ const w=rw[(p.rotation&&p.rotation.level)||'unknown']||0.8;
    (p.roadmap||[]).forEach(r=>{ const e=scan[r.gw]=scan[r.gw]||{bb:0,pl:{},fix:0};
      e.bb+=r.xpts*w; e.pl[p.name]=(e.pl[p.name]||0)+r.xpts; e.fix++; }); });
  let best=null;
  Object.keys(scan).forEach(g=>{ const e=scan[g]; const playing=Object.keys(e.pl).length;
    if(playing>=13 && (!best||e.bb>best.score)) best={gw:+g,score:Math.round(e.bb*10)/10,playing,dgw:e.fix>playing}; });
  return best;
}
function computeConcentration(xi){
  const conc={};
  xi.forEach(p=>{ if(!p.next)return; const k=`${p.next.opp} (${p.next.ven})`;
    (conc[k]=conc[k]||{fixture:k,count:0,fdr:p.next.fdr,players:[]});
    conc[k].count++; conc[k].players.push(p.name); });
  return Object.values(conc).sort((a,b)=>b.count-a.count);
}
function renderRisk(){
  const ov=hasOverrides();
  const eff=effectiveSquad();
  const xi = ov ? eff.filter(p=>!p.on_bench) : DATA.squad.filter(p=>!p.on_bench);
  const concentration = ov ? computeConcentration(xi) : DATA.concentration;
  const nMatch = concentration.length;
  const maxCnt = Math.max(...concentration.map(c=>c.count),1);
  const blocks = concentration.map(c=>{
    const w = 34 + (c.count/maxCnt)*66;
    return `<div class="blk"><div class="bhead"><span class="cnt">${c.count}×</span>
        <span class="fxn">${c.fixture}</span><span class="who">${c.players.join(" · ")}</span></div>
      <div class="bar ${fdrClass(c.fdr)}" style="width:${w}%">${c.count} ${c.count===1?'gracz':'graczy'}<span class="fdrtag">FDR ${c.fdr}</span></div></div>`;
  }).join("");
  el("app").innerHTML = `
    ${ov?'<div class="recbanner">⟳ Koncentracja przeliczona po Twoich transferach. <button class="recundo" onclick="editReset()">Cofnij</button></div>':''}
    <div class="h"><span class="no">03</span><span class="t">Na ilu meczach wisi jedenastka</span><span class="d">${DATA.gw.name}</span></div>
    <div class="headline"><div class="bignum">${xi.length}<span class="arrow">→</span><span class="m">${nMatch}</span></div>
      <div class="txt">Twoja startowa jedenastka rozgrywa się w <b>${nMatch} meczach</b>. Im szerszy i bardziej czerwony pasek, tym więcej Twoich graczy zależy od jednego, trudnego wyniku.</div></div>
    <div class="card">${blocks}</div>
    <div class="legend"><span>FDR:</span><span class="sw f2">1–2</span><span class="sw f3">3</span><span class="sw f4">4</span><span class="sw f5">5</span><span>· szerokość = liczba Twoich graczy</span></div>`;
}
